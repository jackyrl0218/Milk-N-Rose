<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Milk & Rose Homepage Preview</title>
    <link rel="stylesheet" href="../assets/cinelin-tokens.css">
    <link rel="stylesheet" href="../assets/homepage.css">
    <style>
      body {
        margin: 0;
      }

      .visually-hidden {
        clip: rect(0 0 0 0);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        position: absolute;
        width: 1px;
      }

      body.template-index .shopify-section-group-header-group {
        display: none;
      }
    </style>
  </head>
  <body class="template-index">
    <section class="homepage" data-homepage data-auto-rotate="true" data-rotation-speed="18">
      <header class="homepage__topbar" aria-label="MILK & ROSE home navigation">
        <button class="homepage__icon-button" type="button" data-homepage-menu-toggle aria-controls="HomepageMenu-preview" aria-expanded="false">
          <span class="visually-hidden">Open menu</span>
          <svg viewBox="0 0 18 16" aria-hidden="true"><path fill="currentColor" d="M1 3h16v2H1zm0 4h16v2H1zm0 4h16v2H1z"/></svg>
        </button>

        <a class="homepage__brand" href="#">MILK &amp; ROSE</a>

        <div class="homepage__actions">
          <a class="homepage__icon-button" href="#" aria-label="Account">
            <svg viewBox="0 0 18 19" aria-hidden="true"><path fill="currentColor" d="M9 .5a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0 10c5.7 0 8.5 1.6 8.5 7.5v.5H.5V18c0-5.9 2.8-7.5 8.5-7.5Z"/></svg>
          </a>
          <a class="homepage__icon-button" href="#" aria-label="Cart">
            <svg class="icon-cart" viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" d="M20.5 6.5a4.75 4.75 0 0 0-4.75 4.75v.56h-3.16l-.77 11.6a5 5 0 0 0 4.99 5.34h7.38a5 5 0 0 0 4.99-5.33l-.77-11.6h-3.16v-.57A4.75 4.75 0 0 0 20.5 6.5Z"/></svg>
          </a>
        </div>
      </header>

      <div class="homepage__stage" data-homepage-stage>
        <canvas class="homepage__particle-canvas" data-homepage-particles aria-hidden="true"></canvas>

        <div class="homepage__menu" id="HomepageMenu-preview" data-homepage-menu>
          <nav class="homepage__nav" aria-label="Featured navigation">
            <a class="homepage__nav-link" href="#">NEW ARRIVALS</a>
            <a class="homepage__nav-link" href="#">HANDMADE</a>
            <a class="homepage__nav-link" href="#">ESSENTIALS</a>
            <a class="homepage__nav-link" href="#">WOMEN</a>
            <a class="homepage__nav-link" href="#">MEN</a>
            <a class="homepage__nav-link" href="#">ALL JEWELRY</a>
            <a class="homepage__nav-link homepage__nav-link--sale" href="#">SALE</a>
            <a class="homepage__nav-link" href="#">ABOUT</a>
          </nav>
          <div class="homepage__socials" aria-label="Social links">
            <a href="#" aria-label="Instagram">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.2" y="3.2" width="13.6" height="13.6" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14.2" cy="5.8" r="1" fill="currentColor"/></svg>
            </a>
            <a href="#" aria-label="Facebook">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M11.5 18v-7h2.3l.4-2.8h-2.7V6.4c0-.8.2-1.3 1.4-1.3h1.5V2.6c-.7-.1-1.4-.2-2.2-.2-2.2 0-3.8 1.4-3.8 3.8v2H6V11h2.4v7z"/></svg>
            </a>
          </div>
        </div>

        <div class="homepage__orbit-wrap" aria-label="Interactive Milk & Rose product model orbit">
          <div class="homepage__orbit" data-homepage-orbit style="--homepage-model-count: 8;">
            <a class="homepage__model homepage__model--style-1" href="#" style="--homepage-model-index: 0;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Pearl loop</span></a>
            <a class="homepage__model homepage__model--style-2" href="#" style="--homepage-model-index: 1;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Green drop</span></a>
            <a class="homepage__model homepage__model--style-3" href="#" style="--homepage-model-index: 2;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Rose charm</span></a>
            <a class="homepage__model homepage__model--style-4" href="#" style="--homepage-model-index: 3;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Gold piece</span></a>
            <a class="homepage__model homepage__model--style-1" href="#" style="--homepage-model-index: 4;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Silver charm</span></a>
            <a class="homepage__model homepage__model--style-3" href="#" style="--homepage-model-index: 5;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Tiny pearl</span></a>
            <a class="homepage__model homepage__model--style-2" href="#" style="--homepage-model-index: 6;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Mint ring</span></a>
            <a class="homepage__model homepage__model--style-4" href="#" style="--homepage-model-index: 7;"><span class="homepage__model-object" aria-hidden="true"><span class="homepage__model-gem"></span><span class="homepage__model-ring"></span><span class="homepage__model-stone"></span></span><span class="homepage__model-label">Oval gold</span></a>
          </div>
        </div>

        <div class="homepage__controls" aria-label="Model controls">
          <button class="homepage__control" type="button" data-homepage-prev aria-label="Previous model">&lsaquo;</button>
          <button class="homepage__control homepage__control--wide" type="button" data-homepage-expand aria-pressed="false">VIEW</button>
          <button class="homepage__control" type="button" data-homepage-next aria-label="Next model">&rsaquo;</button>
        </div>
      </div>

      <div class="homepage__video-section">
        <div class="homepage__video-shell">
          <button class="homepage__video homepage__video-poster" type="button" aria-label="Play the making process video">
            <span class="homepage__video-placeholder"></span>
            <span class="homepage__play" aria-hidden="true">
              <svg viewBox="0 0 20 20"><path fill="currentColor" d="M6 4v12l10-6z"/></svg>
            </span>
          </button>
        </div>
      </div>
    </section>

    <script src="../assets/homepage.js"></script>
  </body>
</html>

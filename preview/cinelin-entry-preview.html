<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinelin Entry Splash Preview</title>
    <link rel="stylesheet" href="../assets/cinelin-tokens.css">
    <link rel="stylesheet" href="../assets/cinelin-entry.css">
    <script>
      document.cookie = "cinelin_entry_preview_bypass=; Max-Age=0; Path=/; SameSite=Lax";
    </script>
    <style>
      body {
        margin: 0;
      }

      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
    </style>
    <script src="../assets/cinelin-entry.js" defer></script>
  </head>
  <body>
    <section
      id="CinelinEntry-preview"
      class="cinelin-entry"
      data-cinelin-entry
      data-live-duration="3000"
      data-gap-duration="250"
      data-cookie-name="cinelin_entry_preview_bypass"
      style="--cinelin-entry-columns: 5; --cinelin-entry-rows: 4; --cinelin-entry-frame-live: 3000ms; --cinelin-entry-gap: 250ms; --cinelin-wordmark-image: url('../assets/cinelin-wordmark-bg.png');"
    >
      <div class="cinelin-entry__wall" aria-hidden="true">
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 1;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 2;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1506630448388-4e683c67ddb0?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 3;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 4;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1512163143273-bde0e3cc7407?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 5;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 6;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 7;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 8;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1588444650733-d0767b753fc8?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 9;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1506152983158-b4a74a01c721?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 10;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1531995811006-35cb42e1a022?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 11;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 12;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 13;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1543294001-f7cd5d7fb516?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 14;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 15;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1573408301185-9146fe634ad0?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 16;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1601121141461-9d6647bca1ed?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 17;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1619119069152-a2b331eb392a?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 18;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1615655114865-4cc1bda5901e?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 19;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&w=900&q=75" alt=""></div>
        <div class="cinelin-entry__frame" data-entry-frame style="--cinelin-frame-index: 20;"><img class="cinelin-entry__placeholder-image" src="https://images.unsplash.com/photo-1600721391776-b5cd0e0048f9?auto=format&fit=crop&w=900&q=75" alt=""></div>
      </div>

      <div class="cinelin-entry__scanlines" aria-hidden="true"></div>
      <div class="cinelin-entry__grain" aria-hidden="true"></div>

      <div class="cinelin-entry__content">
        <form class="cinelin-entry__form" data-entry-form>
          <h2 class="cinelin-entry__headline" id="CinelinEntryHeading-preview">CINELIN</h2>
          <p class="cinelin-entry__copy">Handcrafted in small batches. Each piece exists between sculpture and machine.</p>

          <div class="cinelin-entry__field">
            <label class="visually-hidden" for="CinelinEntryEmail-preview">Email address</label>
            <input
              id="CinelinEntryEmail-preview"
              class="cinelin-entry__input"
              type="email"
              name="email"
              autocomplete="email"
              placeholder="Email address"
              required
              data-entry-email
            >
          </div>

          <button class="cinelin-entry__button" type="submit">Join</button>
          <p class="cinelin-entry__note">for VIP events, secret sales &amp; birthday gifts.</p>
          <p class="cinelin-entry__success" role="status" data-entry-success hidden></p>
        </form>

        <div class="cinelin-entry__controls">
          <button class="cinelin-entry__control" type="button" data-entry-mute aria-pressed="false">
            <span data-entry-mute-label>Sound on</span>
          </button>
          <button class="cinelin-entry__control" type="button" data-entry-skip>skip</button>
        </div>
      </div>
    </section>
  </body>
</html>
